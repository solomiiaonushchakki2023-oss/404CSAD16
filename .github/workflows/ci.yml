name: CMake CI

on:
  push:
    branches:
      - master
      - develop
      - feature/hello-world
  pull_request:
    branches:
      - master
      - develop

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run
        run: .\build\Release\hello_world.exe

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Run
        run: ./build/hello_world
